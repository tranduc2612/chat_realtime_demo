# Single worker: round-robin state is per-worker-process, so multiple workers
# each keep an independent counter — with only a handful of concurrent
# connections (this demo's scale), that can make requests appear to "stick"
# to one backend instead of visibly rotating. One worker is plenty of
# throughput here and keeps the round-robin behavior deterministic.
worker_processes 1;

events {
    worker_connections 1024;
}

# Layer 4 (TCP) load balancing: everything here operates below HTTP. nginx
# accepts a raw TCP connection on 8000 and relays bytes to/from whichever
# backend it picks — it never parses request lines, headers, or the
# WebSocket Upgrade handshake. WebSocket traffic still works fine (the
# handshake is just bytes on the same TCP connection, forwarded either way),
# but HTTP-aware features are gone: no injected response headers, no
# path-based routing, health checks only know "is the port open" not "did it
# return 200".
stream {
    # $upstream_addr is a connection-level variable (still available at L4,
    # unlike an HTTP response header) — logged here since we can no longer
    # inject an X-Upstream-Addr header to prove rotation via curl.
    log_format lb '$remote_addr -> $upstream_addr [$time_local] '
                  'bytes_sent=$bytes_sent bytes_received=$bytes_received';
    access_log /dev/stdout lb;

    # Named replicas (not a scaled service name) so nginx resolves each host
    # once at config-load time and load-balances between them for real —
    # a bare service name behind `docker compose --scale` would only ever
    # resolve to a single cached IP.
    #
    # Default algorithm (weighted round-robin) rather than least_conn: with
    # least_conn, sequential low-latency connections keep tying at "0 active
    # connections each" and nginx keeps re-picking the same server instead of
    # rotating, which reads as broken load balancing. Round-robin gives a
    # strict, visible 1-2-3 rotation regardless of concurrency.
    upstream backend_pool {
        server backend-a:8000 max_fails=2 fail_timeout=5s;
        server backend-b:8000 max_fails=2 fail_timeout=5s;
        server backend-c:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8000;
        proxy_pass backend_pool;

        proxy_connect_timeout 5s;
        # TCP connections (including WebSockets) can sit idle between
        # messages — nginx's short default timeout would silently drop them.
        proxy_timeout 3600s;
    }
}
