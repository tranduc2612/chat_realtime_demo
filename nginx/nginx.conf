# Single worker: round-robin state is per-worker-process, so multiple workers
# each keep an independent counter — with only a handful of concurrent
# connections (this demo's scale), that can make requests appear to "stick"
# to one backend instead of visibly rotating. One worker is plenty of
# throughput here and keeps the round-robin behavior deterministic.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Required so plain HTTP requests get "Connection: close" while WebSocket
    # upgrade requests get "Connection: upgrade" — nginx's standard pattern for
    # proxying both through the same location block.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Named replicas (not a scaled service name) so nginx resolves each host
    # once at config-load time and load-balances between them for real —
    # a bare service name behind `docker compose --scale` would only ever
    # resolve to a single cached IP.
    #
    # Default algorithm (weighted round-robin) rather than least_conn: with
    # least_conn, sequential low-latency requests keep tying at "0 active
    # connections each" and nginx keeps re-picking the same server instead of
    # rotating, which reads as broken load balancing. Round-robin gives a
    # strict, visible 1-2-3 rotation regardless of request concurrency.
    upstream backend_pool {
        server backend-a:8000 max_fails=2 fail_timeout=5s;
        server backend-b:8000 max_fails=2 fail_timeout=5s;
        server backend-c:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://backend_pool;

            # WebSocket upgrade support — required for
            # /api/v1/messages/ws/{conversation_id} and /api/v1/messages/ws/user/me
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # WebSocket connections are long-lived and mostly idle between
            # messages — nginx's 60s default read/send timeout would silently
            # drop them. The chatbot's SSE stream
            # (POST /api/v1/bot/conversations/{id}/ask) relies on this too.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Response buffering stays on (it's the right default for normal
            # JSON responses); the SSE endpoint opts out per-response by
            # returning `X-Accel-Buffering: no`, which nginx honours. Without
            # that opt-out nginx would hold every token until the answer was
            # complete and streaming would look like a long stall.

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Exposes which replica served the request — handy for verifying
            # load balancing is actually happening (curl -I / browser devtools).
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
