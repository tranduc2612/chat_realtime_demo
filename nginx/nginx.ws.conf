# WebSocket load balancer — the other half of the split (see nginx/nginx.conf,
# port 8000, for the HTTP API). Separate config, separate container, separate
# port: if this one is down, REST keeps serving, and vice versa.
worker_processes 1;

events {
    # Sockets here are long-lived rather than request-shaped, so this pool is
    # bound by concurrent connections in a way the API side is not.
    worker_connections 4096;
}

http {
    # Plain HTTP gets "Connection: close", upgrade requests get
    # "Connection: upgrade" — nginx's standard pattern for proxying WebSockets.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ws_pool {
        server ws-a:8001 max_fails=2 fail_timeout=5s;
        server ws-b:8001 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8001;

        location / {
            proxy_pass http://ws_pool;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # WebSocket connections are long-lived and mostly idle between
            # messages — nginx's 60s default read/send timeout would silently
            # drop them.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No session affinity needed: Redis pub/sub delivers to whichever
            # ws replica holds the socket (see app/core/websocket.py).
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
