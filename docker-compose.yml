services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "12345678"
      MYSQL_DATABASE: chat_realtime_demo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345678"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./chat_with_fastapi
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_NAME: API_CHAT_REALTIME
      APP_VERSION: 1.0.0
      API_PREFIX: /api/v1
      DATABASE_URL: mysql+aiomysql://root:12345678@mysql:3306/chat_realtime_demo
      DATABASE_SYNC_URL: mysql+pymysql://root:12345678@mysql:3306/chat_realtime_demo
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./chat_with_fastapi:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./chat_frontend
    restart: unless-stopped
    command: sh -c "npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./chat_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
