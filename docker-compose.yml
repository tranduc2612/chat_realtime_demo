x-backend-base: &backend-base
  build: ./chat_with_fastapi
  # Tagged so `docker images` shows which version this environment is running
  # (see VERSION at repo root — the single source of truth for APP_VERSION).
  image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}-dev
  restart: unless-stopped
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  environment:
    APP_NAME: API_CHAT_REALTIME
    APP_VERSION: ${APP_VERSION:-1.0.0}
    API_PREFIX: /api/v1
    DATABASE_URL: mysql+aiomysql://root:12345678@mysql:3306/chat_realtime_demo
    DATABASE_SYNC_URL: mysql+pymysql://root:12345678@mysql:3306/chat_realtime_demo
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: dev-secret-key-change-in-production
    # Unset by default — Sentry stays off unless you set SENTRY_DSN in .env.
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  volumes:
    - ./chat_with_fastapi:/app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "12345678"
      MYSQL_DATABASE: chat_realtime_demo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345678"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner. Kept separate from the backend replicas below
  # so `alembic upgrade head` runs exactly once instead of racing 3x
  # concurrently against Alembic's version table.
  migrate:
    build: ./chat_with_fastapi
    image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}-dev
    command: alembic upgrade head
    restart: "no"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: mysql+aiomysql://root:12345678@mysql:3306/chat_realtime_demo
      DATABASE_SYNC_URL: mysql+pymysql://root:12345678@mysql:3306/chat_realtime_demo
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    volumes:
      - ./chat_with_fastapi:/app
    depends_on:
      mysql:
        condition: service_healthy

  # Three named backend replicas load-balanced by nginx (see nginx/nginx.conf).
  # Fixed names (not `docker compose --scale`) so nginx's upstream block can
  # address each one explicitly and actually round-robin between them.
  backend-a:
    <<: *backend-base

  backend-b:
    <<: *backend-base

  backend-c:
    <<: *backend-base

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - backend-a
      - backend-b
      - backend-c

  frontend:
    build: ./chat_frontend
    image: chat_realtime_demo-frontend:${APP_VERSION:-1.0.0}-dev
    restart: unless-stopped
    command: sh -c "npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1
      VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "5173:5173"
    volumes:
      - ./chat_frontend:/app
      - /app/node_modules
    depends_on:
      - nginx

volumes:
  mysql_data:
