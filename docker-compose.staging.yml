# Staging environment. Same 3-replica-behind-nginx topology as production —
# that's the point of staging: catch load-balancing/scaling issues here, not
# a simplified single-container setup. Run via `make staging` (see Makefile),
# which supplies APP_VERSION from the root VERSION file and --env-file
# .env.staging for everything else (copy .env.staging.example first).
#
# Differences from docker-compose.yml (dev):
#   - No bind mounts, no --reload: runs whatever was baked into the image at
#     build time, closer to a real release-candidate build.
#   - Frontend runs a real `vite build` + `vite preview` instead of the dev
#     server.
#   - MySQL/Redis are not published to the host — internal only.
#   - Own port range (8080/5174) and own named volume, so this can run
#     alongside dev on the same machine without colliding.

x-backend-base: &backend-base
  build: ./chat_with_fastapi
  image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}-staging
  restart: unless-stopped
  environment:
    APP_NAME: API_CHAT_REALTIME
    APP_VERSION: ${APP_VERSION:-1.0.0}
    API_PREFIX: /api/v1
    DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    DATABASE_SYNC_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
    # RAG chatbot. Unset OPENAI_API_KEY leaves /api/v1/bot and
    # /api/v1/documents returning 503 — everything else runs as normal.
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    CHROMA_HOST: chroma
    CHROMA_PORT: 8000
    CHROMA_COLLECTION: ${CHROMA_COLLECTION:-internal_docs}
    RAG_TOP_K: ${RAG_TOP_K:-5}
    RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.75}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    # service_started, not service_healthy: the vector store is connected to
    # lazily on the first RAG request (and reconnects on failure), so the
    # backend has no reason to block on Chroma being up.
    chroma:
      condition: service_started

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data_staging:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Vector store for the RAG chatbot — holds the embedded chunks of every
  # uploaded internal document (metadata stays in MySQL). A server rather than
  # an embedded PersistentClient: the three backend replicas would otherwise
  # contend over one SQLite file. Not published to the host (like MySQL/Redis
  # here) — only the backend talks to it. Pinned to match chromadb-client.
  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data_staging:/data

  # One-shot migration runner — see docker-compose.yml for why this is
  # separate from the backend replicas (avoids 3x racing on `alembic upgrade
  # head` at startup).
  migrate:
    build: ./chat_with_fastapi
    image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}-staging
    # See docker-compose.yml for why this retries instead of failing on the
    # first transient connection hiccup.
    command: sh -c "for i in 1 2 3 4 5; do alembic upgrade head && exit 0; echo 'Migration attempt failed, retrying in 5s...' >&2; sleep 5; done; echo 'Migration failed after 5 attempts' >&2; exit 1"
    restart: "no"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_SYNC_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
    depends_on:
      mysql:
        condition: service_healthy

  # Three named backend replicas load-balanced by nginx (see nginx/nginx.conf).
  backend-a:
    <<: *backend-base

  backend-b:
    <<: *backend-base

  backend-c:
    <<: *backend-base

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:8000"
    depends_on:
      - backend-a
      - backend-b
      - backend-c

  frontend:
    build: ./chat_frontend
    image: chat_realtime_demo-frontend:${APP_VERSION:-1.0.0}-staging
    restart: unless-stopped
    # Real production-style build, not the dev server — no bind mount here to
    # go stale against, so building at container start (rather than at image
    # build time) is fine and keeps this file's Dockerfile-free.
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-staging}
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    depends_on:
      - nginx

volumes:
  mysql_data_staging:
  chroma_data_staging:
