# Production environment. Run via `make prod` (see Makefile), which supplies
# APP_VERSION from the root VERSION file and --env-file .env.prod for
# everything else (copy .env.prod.example first and put in REAL secrets —
# the example values are not safe to run with).
#
# Same shape as docker-compose.staging.yml, on its own port range (9000/5175)
# and its own named volume so dev/staging/prod can all run at once without
# colliding. Image tags here carry the bare version (no environment suffix)
# — this is the canonical release artifact.

x-backend-base: &backend-base
  build: ./chat_with_fastapi
  image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}
  restart: unless-stopped
  environment:
    APP_NAME: API_CHAT_REALTIME
    APP_VERSION: ${APP_VERSION:-1.0.0}
    API_PREFIX: /api/v1
    DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    DATABASE_SYNC_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner — see docker-compose.yml for why this is
  # separate from the backend replicas (avoids 3x racing on `alembic upgrade
  # head` at startup).
  migrate:
    build: ./chat_with_fastapi
    image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}
    command: alembic upgrade head
    restart: "no"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_SYNC_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      mysql:
        condition: service_healthy

  # Three named backend replicas load-balanced by nginx (see nginx/nginx.conf).
  backend-a:
    <<: *backend-base

  backend-b:
    <<: *backend-base

  backend-c:
    <<: *backend-base

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-9000}:8000"
    depends_on:
      - backend-a
      - backend-b
      - backend-c

  frontend:
    build: ./chat_frontend
    image: chat_realtime_demo-frontend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-5175}:5173"
    depends_on:
      - nginx

volumes:
  mysql_data_prod:
