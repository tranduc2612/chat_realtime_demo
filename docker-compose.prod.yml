# Production environment — the whole app in one file: infra (MySQL/Redis/
# migrate), the HTTP API behind nginx (:9000), the WebSocket service behind
# its own nginx (:9001), and the frontend (:5175). Run via `make prod` (API
# side), `make ws-prod` (socket side) or `make prod-up` (both), which supply
# APP_VERSION from the root VERSION file and --env-file .env.prod for
# everything else (copy .env.prod.example first and put in REAL secrets — the
# example values are not safe to run with).
#
# Same shape as docker-compose.staging.yml, on its own port range and its own
# named volume so dev/staging/prod can all run at once without colliding
# (`-p chat_realtime_demo_prod`, see the Makefile). Image tags here carry the
# bare version (no environment suffix) — this is the canonical release
# artifact.
#
# The API and WebSocket services are still two independent deployments inside
# this one file — separate images, replicas, nginx and ports, each released or
# restarted without touching the other. See docker-compose.yml's header.

x-backend-env: &backend-env
  APP_NAME: API_CHAT_REALTIME
  APP_VERSION: ${APP_VERSION:-1.0.0}
  API_PREFIX: /api/v1
  DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  DATABASE_SYNC_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

x-backend-base: &backend-base
  environment:
    <<: *backend-env
  build: ./chat_with_fastapi
  image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}
  restart: unless-stopped
  volumes:
    # Avatars. Shared by backend-a/b/c because nginx round-robins: the replica
    # that serves GET /uploads/... is almost never the one that wrote the file.
    # (Replaced by a bucket when this moves to S3.)
    - uploads_data_prod:/app/uploads
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-ws-env: &ws-env
  APP_NAME: CHAT_REALTIME_WS
  APP_VERSION: ${APP_VERSION:-1.0.0}
  API_PREFIX: /api/v1
  DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  REDIS_URL: redis://redis:6379/0
  # Same SECRET_KEY as the API side (same .env file): this side only *verifies*
  # tokens the API issued, so a mismatch rejects every socket with 4001.
  SECRET_KEY: ${SECRET_KEY}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

x-ws-base: &ws-base
  environment:
    <<: *ws-env
  build: ./chat_with_fastapi_ws
  image: chat_realtime_demo-ws:${APP_VERSION:-1.0.0}
  restart: unless-stopped
  # Infrastructure only, never `migrate` or the backend replicas: sockets must
  # come up (and stay up) whether or not the API side is running.
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner — see docker-compose.yml for why this is
  # separate from the backend replicas (avoids 3x racing on `alembic upgrade
  # head` at startup).
  migrate:
    build: ./chat_with_fastapi
    image: chat_realtime_demo-backend:${APP_VERSION:-1.0.0}
    # See docker-compose.yml for why this retries instead of failing on the
    # first transient connection hiccup.
    command: sh -c "for i in 1 2 3 4 5; do alembic upgrade head && exit 0; echo 'Migration attempt failed, retrying in 5s...' >&2; sleep 5; done; echo 'Migration failed after 5 attempts' >&2; exit 1"
    restart: "no"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_SYNC_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      mysql:
        condition: service_healthy

  # ── HTTP API (chat_with_fastapi) ──────────────────────────────────────────
  # Three named backend replicas load-balanced by nginx (see nginx/nginx.conf).
  backend-a:
    <<: *backend-base

  backend-b:
    <<: *backend-base

  backend-c:
    <<: *backend-base

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-9000}:8000"
    depends_on:
      - backend-a
      - backend-b
      - backend-c

  # ── WebSocket service (chat_with_fastapi_ws) ──────────────────────────────
  # Scaled on its own — see nginx/nginx.ws.conf's ws_pool and the Makefile's
  # WS_SERVICES when adding a replica.
  ws-a:
    <<: *ws-base

  ws-b:
    <<: *ws-base

  nginx-ws:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.ws.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${WS_PORT:-9001}:8001"
    depends_on:
      - ws-a
      - ws-b

  frontend:
    build: ./chat_frontend
    image: chat_realtime_demo-frontend:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-5175}:5173"
    depends_on:
      - nginx

volumes:
  mysql_data_prod:
  # Shared by backend-a/b/c — see the note in x-backend-base.
  uploads_data_prod:
